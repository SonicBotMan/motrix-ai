name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          draft: true
          prerelease: false
          generate_release_notes: true

  build-tauri:
    name: Build ${{ matrix.platform }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-ARM64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/gui/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native modules
        run: pnpm rebuild better-sqlite3 esbuild

      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  build-arch-pkg:
    name: Build Arch PKG (x86_64)
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build inside Arch container (Tauri 2 needs WebKitGTK 4.1)
        run: |
          docker build -f packaging/arch/Dockerfile -t motrix-arch-build .
          mkdir -p artifacts
          docker run --rm -v "$PWD/artifacts:/out" motrix-arch-build /app/packaging/arch/package.sh
      - name: Attach PKG to release
        uses: softprops/action-gh-release@v2
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: artifacts/*.pkg.tar.zst

  verify-artifacts:
    name: Verify Artifacts (anti-mislabel gate)
    needs: [create-release, build-tauri, build-arch-pkg]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install 7zip (dmg inspection)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq 7zip 2>/dev/null || sudo apt-get install -y -qq p7zip-full || true
      - name: Verify all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-artifacts.sh "${{ needs.create-release.outputs.release_id }}" ./artifacts

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri, build-arch-pkg, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Publish Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          draft: false
          release_id: ${{ needs.create-release.outputs.release_id }}
